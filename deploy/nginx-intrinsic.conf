# Nginx site config for Intrinsic — intrinsicamerica.com
# Canonical host: https://intrinsicamerica.com (non-www, HTTPS)
#
# Serving model (SEO/GEO fix, Oct 2026):
#   - Static hashed assets  -> served from the React build dir (missing = real 404)
#   - /api/, robots, sitemap, llms -> FastAPI (127.0.0.1:8000)
#   - EVERY OTHER request (HTML pages) -> proxied to FastAPI SSR (/api/ssr), which
#     returns fully-rendered, page-specific HTML from the live DB, or a 301
#     (legacy/alias/www) or a genuine 404/410. No SPA-shell-for-everything.
#
# Run `nginx -t` before `systemctl reload nginx`. Keep your existing SSL cert paths.

# 1) HTTP -> HTTPS (both hosts), preserve path + query
server {
    listen 80;
    listen [::]:80;
    server_name intrinsicamerica.com www.intrinsicamerica.com;
    return 301 https://intrinsicamerica.com$request_uri;
}

# 2) HTTPS www -> non-www, preserve path + query
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.intrinsicamerica.com;
    ssl_certificate     /etc/letsencrypt/live/intrinsicamerica.com/fullchain.pem;   # adjust to your cert
    ssl_certificate_key /etc/letsencrypt/live/intrinsicamerica.com/privkey.pem;      # adjust to your cert
    return 301 https://intrinsicamerica.com$request_uri;
}

# 3) Canonical host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name intrinsicamerica.com;

    ssl_certificate     /etc/letsencrypt/live/intrinsicamerica.com/fullchain.pem;   # adjust to your cert
    ssl_certificate_key /etc/letsencrypt/live/intrinsicamerica.com/privkey.pem;      # adjust to your cert

    root /var/www/intrinsic/current/frontend/build;   # versioned release symlink (see DEPLOYMENT.md)

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # Let the SSR backend return proper 404/410 bodies (do not swallow upstream errors)
    proxy_intercept_errors off;

    # API -> FastAPI
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Crawler files -> FastAPI-generated (always current)
    location = /robots.txt  { proxy_pass http://127.0.0.1:8000/api/robots.txt; }
    location = /sitemap.xml { proxy_pass http://127.0.0.1:8000/api/sitemap.xml; }
    location = /llms.txt    { proxy_pass http://127.0.0.1:8000/api/llms.txt; }

    # Immutable hashed build assets -> long cache. Missing asset = real 404 (never SPA shell).
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Other real files in the build (favicons, images, manifest, svg, etc.): serve if present,
    # otherwise fall through to SSR (which will 404 unknown paths).
    location ~* \.(?:ico|png|jpg|jpeg|gif|webp|svg|js|css|map|txt|woff2?|ttf|eot|json|webmanifest|xml)$ {
        try_files $uri @ssr;
    }

    # Admin app (SPA, client-rendered) -> SSR shell. Server-level noindex header so
    # admin pages are never indexed even before the HTML/meta loads. Security headers
    # are re-declared here because any add_header in a location replaces inherited ones.
    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://127.0.0.1:8000/api/ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-URI $request_uri;
    }

    # All HTML page requests -> FastAPI SSR (fresh per-route HTML, or 301 / 404 / 410)
    location / {
        proxy_pass http://127.0.0.1:8000/api/ssr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-URI $request_uri;   # backend renders this exact path
        add_header Cache-Control "public, max-age=60";
    }

    location @ssr {
        # Named locations can't carry a URI in proxy_pass; rewrite to the SSR endpoint.
        # The real requested path is still conveyed via X-Original-URI below.
        rewrite ^ /api/ssr break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Original-URI $request_uri;
        add_header Cache-Control "public, max-age=60";
    }
}
